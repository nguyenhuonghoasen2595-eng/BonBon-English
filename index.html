<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BonBon English</title>

  <!-- Hãy đảm bảo 3 dòng này trỏ đúng vào thư mục css/ -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="app-container">
    <!-- Header / Thanh công cụ -->
    <header class="top-bar">
      <button class="home-btn">🏠 Trang chủ</button>
      <div class="tags">
        <span class="tag">Từ vựng • Level 1</span>
        <span class="tag">🐶 Động vật</span>
      </div>
      <div class="speed-controls">
        <button class="speed-btn active" data-speed="1.0">1.0x</button>
        <button class="speed-btn" data-speed="0.75">0.75x</button>
        <button class="speed-btn" data-speed="0.5">0.5x</button>
      </div>
      <div class="score">⭐ <span id="score-val">0</span></div>
    </header>

    <div class="progress-text"><span id="current-index">1</span> / <span id="total-count">5</span></div>

    <!-- FLASHCARD CONTAINER (TẢI VỪA KHỔ 500x500 & CÓ CHỨC NĂNG LẬT) -->
    <div class="card-wrapper">
      <div class="flashcard" id="flashcard">
        
        <!-- MẶT TRƯỚC: HÌNH + TỪ VỰNG -->
        <div class="card-face card-front">
          <div class="img-box">
            <img id="card-img" src="" alt="Vocabulary Image">
          </div>
          <div class="card-info">
            <h2 id="card-word">Dog</h2>
            <p id="card-meaning">Con chó</p>
            <button class="audio-btn" id="btn-audio-word">🔊 Nghe từ</button>
          </div>
          <span class="flip-hint">🔄 Bấm vào thẻ để lật mặt sau</span>
        </div>

        <!-- MẶT SAU: CỤM TỪ VÍ DỤ -->
        <div class="card-face card-back">
          <div class="example-box">
            <h3>💡 Câu Ví Dụ</h3>
            <p class="example-en" id="card-example">A cute dog</p>
            <p class="example-vi" id="card-example-vi">Một chú chó đáng yêu</p>
            <button class="audio-btn highlight" id="btn-audio-example">🔊 Nghe câu</button>
          </div>
          <span class="flip-hint">🔄 Bấm vào thẻ để lật mặt trước</span>
        </div>

      </div>
    </div>

    <!-- NÚT CHUYỂN BÀI -->
    <div class="navigation-controls">
      <button id="prev-btn">⬅ Quay lại</button>
      <button id="next-btn">Tiếp theo ➡</button>
    </div>
  </div>
<!-- NHÚNG CÁC FILE SCRIPT THEO ĐÚNG THỨ TỰ -->
  <script src="js/app.js"></script>
  <script src="js/data/vocab/level1.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
