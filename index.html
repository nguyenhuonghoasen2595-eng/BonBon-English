<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BonBon English - Level 1</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-container">
    <!-- Chọn chủ đề -->
    <div class="topic-selector">
      <label for="topic-select">Chủ đề: </label>
      <select id="topic-select" onchange="changeTopic(this.value)">
        <option value="animals">🐶 Động vật</option>
        <option value="colors">🎨 Màu sắc</option>
        <option value="fruits">🍎 Trái cây</option>
        <option value="vegetables">🥦 Rau củ quả</option>
        <option value="weather">☀️ Thời tiết</option>
        <option value="vehicles">🚗 Phương tiện</option>
        <option value="family">👨‍👩‍👧 Gia đình</option>
        <option value="toys">🧸 Đồ chơi</option>
        <option value="school">🎒 Dụng cụ học tập</option>
        <option value="food">🍕 Món ăn</option>
        <option value="drinks">🧃 Đồ uống</option>
        <option value="places">🏫 Địa điểm</option>
        <option value="routine">⏰ Daily Routine</option>
        <option value="jobs">👩‍🏫 Nghề nghiệp</option>
        <option value="emotions">😊 Cảm xúc</option>
        <option value="personality">🌟 Tính cách</option>
      </select>
    </div>

    <!-- Header: Level & Sao -->
    <div class="header-info">
      <span id="level-title">Level 1</span>
      <div class="star-counter">
        ⭐ <span id="total-stars">0</span>
      </div>
    </div>

    <!-- Tiến trình -->
    <div class="progress-container">
      <div id="progress-text">1 / 5</div>
      <div class="progress-bar">
        <div class="progress-bar-fill" id="progress-bar-fill"></div>
      </div>
    </div>

    <!-- Thẻ lật 3D 2 Mặt -->
    <div class="card-container" onclick="flipCard()">
      <div class="card-inner" id="card-inner">
        <!-- MẶT TRƯỚC -->
        <div class="card-front">
          <span class="flip-hint">🔄 Chạm để lật mặt sau</span>
          <img id="card-image" src="" alt="Từ vựng">
          <div class="word" id="word">Word</div>
          <div class="meaning" id="meaning">Nghĩa tiếng Việt</div>
          
          <!-- Tốc độ âm thanh mặt trước -->
          <div class="audio-controls" onclick="event.stopPropagation();">
            <span style="font-size: 13px; font-weight: bold; color: #666;">Tốc độ:</span>
            <button onclick="setSpeed(0.75)" class="speed-btn">0.75x</button>
            <button onclick="setSpeed(1.0)" class="speed-btn active">1.0x</button>
            <button onclick="setSpeed(1.25)" class="speed-btn">1.25x</button>
            <button class="btn-audio" onclick="playCurrentWordAudio()">🔊 Nghe từ</button>
          </div>
        </div>

        <!-- MẶT SAU -->
        <div class="card-back">
          <span class="flip-hint">🔄 Chạm để quay lại</span>
          <h3 style="color: #ff9800; margin-bottom: 10px;">💡 Câu Ví Dụ</h3>
          <div class="example-sentence" id="example-en">Example English sentence</div>
          <div class="example-meaning" id="example-vi">Nghĩa tiếng Việt của câu</div>
          
          <!-- Tốc độ âm thanh mặt sau -->
          <div class="audio-controls" onclick="event.stopPropagation();">
            <span style="font-size: 13px; font-weight: bold; color: #666;">Tốc độ:</span>
            <button onclick="setSpeed(0.75)" class="speed-btn">0.75x</button>
            <button onclick="setSpeed(1.0)" class="speed-btn active">1.0x</button>
            <button onclick="setSpeed(1.25)" class="speed-btn">1.25x</button>
            <button class="btn-audio" onclick="playCurrentExampleAudio()">🔊 Nghe câu</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Nút điều khiển -->
    <div class="controls">
      <button class="btn btn-prev" onclick="prevWord()">⬅️ Quay lại</button>
      <button class="btn btn-next" onclick="nextWord()">Tiếp ➡️</button>
    </div>
  </div>

  <!-- Popup Chúc Mừng Hoàn Thành -->
  <div class="popup-overlay" id="congrat-popup">
    <div class="popup-content">
      <h2 style="color: #ff9800; margin-bottom: 10px; font-size: 28px;">🎉 Tuyệt vời! 🎉</h2>
      <p style="font-size: 18px; color: #333;" id="popup-message">Bé đã hoàn thành bài học!</p>
      <div style="font-size: 36px; margin: 15px 0;">⭐⭐⭐⭐⭐</div>
      <p style="font-size: 16px; color: #4caf50; font-weight: bold;">+5 Sao thưởng</p>
      <button class="btn-continue" onclick="closePopupAndNext()">Tiếp tục 🚀</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
