<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BonBon English - Flashcards</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>

    <header>
        <h1>🎈 BonBon English 🎈</h1>
        <p>Thẻ học từ vựng & mẫu câu tiếng Anh cho bé</p>
    </header>

    <main class="container">
        <!-- Thẻ Flashcard -->
        <div class="card-container" onclick="flipCard()">
            <div class="card" id="flashcard">
                <!-- Mặt trước: Hình ảnh & Mẫu câu tiếng Anh -->
                <div class="card-front">
                    <span class="badge">Topic: Animals</span>
                    <div class="emoji" id="card-emoji">🐶</div>
                    <h2 id="card-en">It is a dog.</h2>
                    <p class="vocab-word">Word: <strong>Dog</strong></p>
                    <button class="audio-btn" onclick="speakText(event)">🔊 Nghe phát âm</button>
                </div>
                <!-- Mặt sau: Dịch nghĩa tiếng Việt -->
                <div class="card-back">
                    <span class="badge">Nghĩa tiếng Việt</span>
                    <h2 id="card-vi">Đó là một con chó.</h2>
                    <p class="hint">Bấm vào thẻ để lật lại mặt trước</p>
                </div>
            </div>
        </div>

        <!-- Thanh điều hướng -->
        <div class="controls">
            <button onclick="prevCard()">⬅️ Câu trước</button>
            <span id="card-counter">1 / 4</span>
            <button onclick="nextCard()">Câu tiếp ➡️</button>
        </div>
    </main>

    <footer>
        <p>🎁 Học online miễn phí | Tích hợp cùng Bộ Flashcard in giấy BonBon English</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
