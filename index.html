<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BonBon English - Học Tiếng Anh Cho Bé</title>
  
  <!-- 1. CSS Giao diện tách nhỏ -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <!-- Theme màu sắc riêng theo Level (có thể đổi linh hoạt) -->
  <link id="theme-link" rel="stylesheet" href="css/themes/level1-theme.css">
</head>
<body>
  <div class="app-container">
    <!-- Header: Sao & Chế độ học -->
    <header class="header">
      <div class="stars-count">⭐ <span id="total-stars">0</span></div>
      <div class="main-tabs">
        <button id="tab-vocab-btn" class="tab-btn active" onclick="switchMainTab('vocab')">Từ Vựng</button>
        <button id="tab-sentence-btn" class="tab-btn" onclick="switchMainTab('sentence')">Mẫu Câu</button>
      </div>
    </header>

    <!-- Chọn Cấp độ, Chủ đề & Tốc độ -->
    <div class="controls-top">
      <select id="level-select" onchange="changeLevel(this.value)">
        <option value="level1">🌱 Cấp độ 1 (Level 1)</option>
        <option value="level2">🌿 Cấp độ 2 (Level 2)</option>
      </select>

      <select id="topic-select" onchange="changeTopic(this.value)">
        <option value="animals">🐶 Động vật</option>
        <option value="colors">🎨 Màu sắc</option>
      </select>

      <div class="speed-controls">
        <button class="speed-btn active" onclick="setSpeed(1.0)">1.0x</button>
        <button class="speed-btn" onclick="setSpeed(0.75)">0.75x</button>
      </div>
    </div>

    <!-- Thanh tiến trình -->
    <div class="progress-container">
      <div id="progress-bar-fill" class="progress-bar"></div>
      <span id="progress-text">1 / 2</span>
    </div>

    <!-- Thẻ Flashcard 3D -->
    <div class="card-container" onclick="flipCard()">
      <div class="card-inner" id="card-inner">
        <!-- Mặt trước -->
        <div class="card-front">
          <img id="card-image" src="" alt="Illustration">
          <h2 id="word">Word</h2>
          <p id="meaning">Nghĩa tiếng Việt</p>
          <button class="btn-audio" onclick="event.stopPropagation(); playCurrentFrontAudio();">🔊 Nghe</button>
        </div>
        <!-- Mặt sau -->
        <div class="card-back">
          <h3 id="back-title">💡 Câu Ví Dụ</h3>
          <p id="example-en" class="example-en">Example sentence</p>
          <p id="example-vi" class="example-vi">Dịch câu ví dụ</p>
          <button class="btn-audio" onclick="event.stopPropagation(); playCurrentBackAudio();">🔊 Nghe câu</button>
        </div>
      </div>
    </div>

    <!-- Nút Điều hướng -->
    <div class="controls">
      <button class="btn btn-prev" onclick="prevItem()">⬅ Quay lại</button>
      <button class="btn btn-next" onclick="nextItem()">Tiếp theo ➡</button>
    </div>
  </div>

  <!-- Popup Chúc Mừng -->
  <div class="popup-overlay" id="congrat-popup" style="display: none;">
    <div class="popup-content">
      <h2 style="color: var(--primary-color, #ff9800); margin-bottom: 10px;">🎉 PHẦN THƯỞNG! 🎉</h2>
      <p id="popup-message" style="font-size: 18px; color: #333;">Bé đã hoàn thành xuất sắc bài học!</p>
      <div style="font-size: 36px; margin: 15px 0;">⭐ +5</div>
      <button class="btn-continue" onclick="closePopupAndNext()">Bài tiếp theo 🚀</button>
    </div>
  </div>

  <!-- 2. Dữ liệu bài học JS -->
  <script src="js/data/vocab/level1.js"></script>
  <script src="js/data/vocab/level2.js"></script>
  <script src="js/data/sentences/level1.js"></script>

  <!-- Gộp bộ dữ liệu cho App đọc -->
  <script>
    const vocabData = { level1: vocabLevel1, level2: vocabLevel2 };
    const sentenceData = { level1: sentenceLevel1 };
  </script>

  <!-- 3. Logic xử lý tính năng JS -->
  <script src="js/audio.js"></script>
  <script src="js/card-flip.js"></script>
  <script src="js/reward.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
